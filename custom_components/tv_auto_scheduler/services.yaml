scan:
  name: Scan TV auto schedule rules
  description: Scan EPG sensors against the CSV rule file and log matching programmes.
  fields:
    rules_file:
      name: Rules file
      description: Path to the CSV rules file.
      required: false
      example: /config/tv_auto_scheduler/rules.csv
      selector:
        text:

    dry_run:
      name: Dry run
      description: Only log matches, do not create or change calendar events.
      required: false
      default: true
      selector:
        boolean:

    pre_calendar:
      name: Pre calendar
      required: false
      example: calendar.pre_tv
      selector:
        entity:
          domain: calendar

    tv_calendar:
      name: TV calendar
      required: false
      example: calendar.televisie
      selector:
        entity:
          domain: calendar

    show_missing_epg:
      name: Show missing EPG entities
      description: Log every channel whose configured EPG entity is missing.
      required: false
      default: false
      selector:
        boolean:

    change_log:
      name: Change log
      description: Append created calendar changes to a CSV file.
      required: false
      default: false
      selector:
        boolean:

    change_log_file:
      name: Change log file
      description: Optional CSV file path for the change log. When omitted, the file is created next to the rules file.
      required: false
      example: /config/tv_auto_scheduler/tv_auto_scheduler_changes.csv
      selector:
        text:


compare_canalplus:
  name: Compare Open EPG with Canal+
  description: Experimental report-only comparison between the existing Open EPG sensor data and Canal+ schedule data.
  fields:
    canalplus_authorization:
      name: Canal+ authorization
      description: Full Authorization header value copied from an authenticated Canal+ browser request.
      required: true
      selector:
        text:
          type: password

    canalplus_channels:
      name: Canal+ channels
      description: Mapping from Open EPG channel keys to Canal+ channel IDs.
      required: true
      example:
        npo1: 9zhabdaigZd4WCwrn1Yyl7LtviNAKEgAgG6ysNpd
      selector:
        object:

    comparison_report_file:
      name: Comparison report file
      description: Optional CSV path where comparison rows are written. Existing content is replaced.
      required: false
      example: /config/tv_auto_scheduler/canalplus_comparison.csv
      selector:
        text:

    show_missing_epg:
      name: Show missing EPG entities
      description: Log every channel whose configured Open EPG entity is missing before comparison.
      required: false
      default: false
      selector:
        boolean:
