scan:
  name: Scan TV auto schedule rules
  description: Scan EPG sensors against the CSV rule file and log matching programmes.
  fields:
    rules_file:
      name: Rules file
      description: Path to the CSV rules file.
      required: false
      example: /config/tv_auto_scheduler/rules.csv
      selector:
        text:

    dry_run:
      name: Dry run
      description: Only log matches, do not create or change calendar events.
      required: false
      default: true
      selector:
        boolean:

    pre_calendar:
      name: Pre calendar
      required: false
      example: calendar.pre_tv
      selector:
        entity:
          domain: calendar

    tv_calendar:
      name: TV calendar
      required: false
      example: calendar.televisie
      selector:
        entity:
          domain: calendar

    show_missing_epg:
      name: Show missing EPG entities
      description: Log every channel whose configured EPG entity is missing.
      required: false
      default: false
      selector:
        boolean:

    change_log:
      name: Change log
      description: Append created calendar changes to a CSV file.
      required: false
      default: false
      selector:
        boolean:

    change_log_file:
      name: Change log file
      description: Optional CSV file path for the change log. When omitted, the file is created next to the rules file.
      required: false
      example: /config/tv_auto_scheduler/tv_auto_scheduler_changes.csv
      selector:
        text:

    calendar_description_mode:
      name: Calendar description mode
      description: Use programme for a clean dashboard description and store scheduler metadata in location. Use debug to show scheduler metadata in the description.
      required: false
      default: programme
      example: programme
      selector:
        select:
          options:
            - programme
            - debug

export_open_epg:
  name: Export Open EPG snapshot
  description: Write the current normalized Open EPG sensor data to a JSON file for external tools.
  fields:
    open_epg_export_file:
      name: Export file
      description: JSON file path where the Open EPG snapshot is written.
      required: false
      default: /config/tv_auto_scheduler/open_epg_snapshot.json
      example: /config/tv_auto_scheduler/open_epg_snapshot.json
      selector:
        text:

    show_missing_epg:
      name: Show missing EPG entities
      description: Log every channel whose configured EPG entity is missing before exporting.
      required: false
      default: false
      selector:
        boolean:


compare_canalplus:
  name: Compare Open EPG with Canal+
  description: Experimental report-only comparison between the existing Open EPG sensor data and Canal+ schedule data.
  fields:
    canalplus_authorization:
      name: Canal+ authorization
      description: Full Authorization header value copied from an authenticated Canal+ browser request.
      required: true
      selector:
        text:
          type: password

    canalplus_channels:
      name: Canal+ channels
      description: Optional mapping from Open EPG channel keys to Canal+ channel IDs. Values override channels_file entries.
      required: false
      example:
        npo1: 9zhabdaigZd4WCwrn1Yyl7LtviNAKEgAgG6ysNpd
      selector:
        object:

    channels_file:
      name: Channels file
      description: YAML channel database containing canalplus_id values.
      required: false
      default: /config/tv/channels.yaml
      example: /config/tv/channels.yaml
      selector:
        text:

    comparison_report_file:
      name: Comparison report file
      description: Optional CSV path where comparison rows are written. Existing content is replaced.
      required: false
      example: /config/tv_auto_scheduler/canalplus_comparison.csv
      selector:
        text:

    pre_calendar:
      name: Pre calendar
      description: Calendar used when only_scheduled_programmes is enabled.
      required: false
      default: calendar.pre_tv
      example: calendar.pre_tv
      selector:
        entity:
          domain: calendar

    tv_calendar:
      name: TV calendar
      description: Calendar used when only_scheduled_programmes is enabled.
      required: false
      default: calendar.televisie
      example: calendar.televisie
      selector:
        entity:
          domain: calendar

    only_scheduled_programmes:
      name: Only scheduled programmes
      description: Compare only Open EPG programmes that already exist as scheduler-created events in pre_calendar or tv_calendar.
      required: false
      default: false
      selector:
        boolean:

    show_matching_programmes:
      name: Show matching programmes
      description: Include confirmed matches in the comparison output. Disable to report only differences and fetch errors.
      required: false
      default: true
      selector:
        boolean:

    show_missing_epg:
      name: Show missing EPG entities
      description: Log every channel whose configured Open EPG entity is missing before comparison.
      required: false
      default: false
      selector:
        boolean:
