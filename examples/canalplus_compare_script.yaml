compare_canalplus_epg:
  alias: Compare Canal+ EPG
  mode: single
  fields:
    bearer_token:
      name: Canal+ bearer token
      required: true
      selector:
        text:
          type: password
  sequence:
    - variables:
        report_file: >
          /config/tv_auto_scheduler/{{ now().strftime("%y%m%d_%H%M") }}_canalplus_comparison.csv
    - action: tv_auto_scheduler.compare_canalplus
      data:
        canalplus_authorization: "Bearer {{ bearer_token }}"
        channels_file: /config/tv/channels.yaml
        comparison_report_file: "{{ report_file }}"
    - action: persistent_notification.create
      data:
        title: Canal+ EPG comparison requested
        message: >
          The comparison service completed. Check {{ report_file }} and home-assistant.log.
